<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starting ClaudeWorkbench…</title>
    <style>
        html, body { height: 100%; margin: 0; }
        body {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 1rem; background: #1e1e1e; color: #d4d4d4;
            font: 500 0.95rem/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        .spinner {
            width: 46px; height: 46px; border-radius: 50%;
            border: 4px solid #3a3a3a; border-top-color: #4aa3ff;
            animation: spin .9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hint { opacity: .55; font-size: .8rem; }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <div>Starting ClaudeWorkbench…</div>
    <div class="hint">waiting for the workbench to come up</div>
    <script>
        // Opened by the Launcher the instant "Start" is clicked — before the .NET host is even
        // serving. Poll the host and redirect to it the moment it answers, so the whole cold-boot
        // window shows this spinner instead of a blank/absent window. An <img> ping to the host's
        // favicon is used for liveness because it works cross-origin from this file:// page.
        (function () {
            var target = new URLSearchParams(location.search).get("target");
            if (!target) { document.body.textContent = "No target URL."; return; }
            function poll() {
                var img = new Image();
                img.onload = function () { location.replace(target); };
                img.onerror = function () { setTimeout(poll, 500); };
                img.src = target + "/favicon.ico?_=" + Date.now();
            }
            poll();
        })();
    </script>
</body>
</html>
